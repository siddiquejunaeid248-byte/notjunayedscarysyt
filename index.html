<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not Junayed Scary - Horror Content Portal</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      padding-bottom: 50px;
    }

    /* Header Styling */
    header {
      background-color: #181818;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #8b0000;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #ff0000;
      object-fit: cover;
    }

    .brand-title {
      font-size: 22px;
      font-weight: bold;
      color: #ff3333;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .brand-tagline {
      font-size: 11px;
      color: #aaaaaa;
      display: block;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* Social Media Links Styling */
    .social-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .social-icon {
      color: #cccccc;
      font-size: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #000000;
      border: 1px solid #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-icon:hover {
      color: #ffffff;
      transform: translateY(-3px);
    }

    .social-icon.youtube:hover { background-color: #ff0000; border-color: #ff0000; box-shadow: 0 0 10px rgba(255, 0, 0, 0.6); }
    .social-icon.facebook:hover { background-color: #1877f2; border-color: #1877f2; box-shadow: 0 0 10px rgba(24, 119, 242, 0.6); }
    .social-icon.discord:hover { background-color: #5865f2; border-color: #5865f2; box-shadow: 0 0 10px rgba(88, 101, 242, 0.6); }
    .social-icon.instagram:hover { background-color: #e4405f; border-color: #e4405f; box-shadow: 0 0 10px rgba(228, 64, 95, 0.6); }

    /* YouTube Subscribe Button Styling */
    .subscribe-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #ff0000;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .subscribe-btn:hover {
      background-color: #cc0000;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
      transform: translateY(-2px);
    }

    .subscribe-btn i {
      font-size: 15px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background-color: #000000;
      border: 1px solid #333333;
      border-radius: 20px;
      overflow: hidden;
      padding: 5px 15px;
      width: 220px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      width: 100%;
      padding: 5px;
    }

    .search-box i {
      color: #888888;
    }

    /* Navigation Bar */
    nav {
      background-color: #121212;
      padding: 12px 40px;
      display: flex;
      gap: 15px;
      border-bottom: 1px solid #222222;
      overflow-x: auto;
    }

    .nav-btn {
      background-color: #222222;
      color: #cccccc;
      border: 1px solid #333;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .nav-btn:hover, .nav-btn.active {
      background-color: #ff0000;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
      transform: translateY(-2px);
    }

    /* Banner / Hero Section */
    .hero-banner {
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('logo.jpg') center/cover;
      padding: 30px 40px;
      margin: 20px 40px;
      border-radius: 12px;
      border-left: 5px solid #ff0000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .hero-text {
      max-width: 600px;
    }

    .hero-banner h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #ff4d4d;
    }

    .hero-banner p {
      color: #dddddd;
      font-size: 14px;
      line-height: 1.6;
    }

    /* Video Grid Section */
    .section-title {
      margin: 30px 40px 15px 40px;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 0 40px;
    }

    .video-card {
      background-color: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .video-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
      border-color: #ff0000;
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      height: 165px;
      background-color: #333;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 0, 0, 0.85);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .video-card:hover .play-btn {
      opacity: 1;
    }

    .video-info {
      padding: 15px;
    }

    .video-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
      color: #ffffff;
    }

    .video-desc {
      font-size: 12px;
      color: #aaaaaa;
    }

    /* Modal Player Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 850px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #ff0000;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 15px;
      color: white;
      font-size: 28px;
      cursor: pointer;
      z-index: 1001;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #ff0000;
    }

    .iframe-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-right {
        width: 100%;
        justify-content: space-between;
      }
      .search-box {
        width: 100%;
      }
      .hero-banner, .video-grid, .section-title {
        margin-left: 15px;
        margin-right: 15px;
        padding-left: 0;
        padding-right: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-container">
      <img src="logo.jpg" alt="Not Junayed Scary Logo" class="logo-img">
      <div>
        <span class="brand-title">Not Junayed Scary</span>
        <span class="brand-tagline">The Realm of Horror & Suspense</span>
      </div>
    </div>

    <div class="header-right">
      <!-- Social Media Links -->
      <div class="social-links">
        <a href="https://www.youtube.com/@notjunayedscarys" target="_blank" class="social-icon youtube" title="YouTube Channel"><i class="fab fa-youtube"></i></a>
        <a href="https://facebook.com" target="_blank" class="social-icon facebook" title="Facebook Page"><i class="fab fa-facebook-f"></i></a>
        <a href="https://discord.gg/nFnCTb7An4" target="_blank" class="social-icon discord" title="Discord Server"><i class="fab fa-discord"></i></a>
        <a href="https://www.instagram.com/notlegendxd02/" target="_blank" class="social-icon instagram" title="Instagram Profile"><i class="fab fa-instagram"></i></a>
      </div>

      <!-- YouTube Subscribe Button -->
      <a href="https://www.youtube.com/@notjunayedscarys?sub_confirmation=1" target="_blank" class="subscribe-btn">
        <i class="fab fa-youtube"></i> Subscribe
      </a>

      <!-- Search Box -->
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search Horror Video...">
        <i class="fas fa-search"></i>

  </header>

  <!-- Categories Navigation -->
  <nav>
    <button class="nav-btn active" onclick="filterCategory('all', event)">All Stories</button>
    <button class="nav-btn" onclick="filterCategory('classics', event)">Minecraft Monsters</button>
    <button class="nav-btn" onclick="filterCategory('psychological', event)">Creepy Entities</button>
    <button class="nav-btn" onclick="filterCategory('gothic', event)">Scariest Mods</button>
    <button class="nav-btn" onclick="filterCategory('supernatural', event)">Survival Horror</button>
  </nav>

  <!-- Banner -->
  <div class="hero-banner">
    <div class="hero-text">
      <h2>Welcome to Not Junayed Scary</h2>
      <p>Experience the ultimate Minecraft horror world! Enjoy spine-chilling monsters, creepy entities, and terrifying survival tales.</p>
    </div>
    <a href="https://www.youtube.com/@notjunayedscarys?sub_confirmation=1" target="_blank" class="subscribe-btn" style="padding: 12px 24px; font-size: 15px;">
      <i class="fab fa-youtube"></i> Subscribe Now
    </a>
  </div>

  <div class="section-title">
    <i class="fas fa-ghost" style="color: #ff0000;"></i> Latest Uploads
  </div>

  <!-- Video Grid -->
  <div class="video-grid" id="videoGrid"></div>

  <!-- Video Modal -->
  <div class="modal" id="videoModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeVideo()">&times;</span>
      <div class="iframe-container">
        <iframe id="youtubeIframe" src="" frameborder="0" allowfullscreen allow="autoplay"></iframe>
      </div>
    </div>
  </div>

  <script>
    const videos = [
      {
        id: "O6sio2rwtm0",
        title: "I Added Minecraft's Scariest Monster...",
        desc: "Not Junayed Scary - Minecraft Horror Gameplay",
        category: "classics",
        thumb: "https://img.youtube.com/vi/O6sio2rwtm0/hqdefault.jpg"
      },
      {
        id: "_1uz1h-uEVE",
        title: "I Added the Creepiest Entity to My Minecraft World",
        desc: "Not Junayed Scary - Minecraft Creepy Entity",
        category: "psychological",
        thumb: "https://img.youtube.com/vi/_1uz1h-uEVE/hqdefault.jpg"
      },
      {
        id: "h1dVgSExdl0",
        title: "I Added the Deadliest Monster to My Minecraft World",
        desc: "Not Junayed Scary - Deadliest Monster Survival",
        category: "classics",
        thumb: "https://img.youtube.com/vi/h1dVgSExdl0/hqdefault.jpg"
      },
      {
        id: "NaSnj3B1aLc",
        title: "I Added Minecraft's Scariest Monster - The Locust",
        desc: "Not Junayed Scary - The Locust Horror Mod",
        category: "gothic",
        thumb: "https://img.youtube.com/vi/NaSnj3B1aLc/hqdefault.jpg"
      },
      {
        id: "CLEMELI3pTc",
        title: "I Tried to Survive Minecraft's Creepiest Monster",
        desc: "Not Junayed Scary - Survival Challenge",
        category: "supernatural",
        thumb: "https://img.youtube.com/vi/CLEMELI3pTc/hqdefault.jpg"
      },
      {
        id: "A75UWJfVqf4",
        title: "I Found the Scariest Creature in Minecraft...",
        desc: "Not Junayed Scary - Scariest Creature Exploration",
        category: "psychological",
        thumb: "https://img.youtube.com/vi/A75UWJfVqf4/hqdefault.jpg"
      },
      {
        id: "2XuAVaJylEY",
        title: "I Found Minecraft Creepiest Monster",
        desc: "Not Junayed Scary - Creepiest Monster Hunt",
        category: "classics",
        thumb: "https://img.youtube.com/vi/2XuAVaJylEY/hqdefault.jpg"
      },
      {
        id: "bWxxOkOsOpY",
        title: "I Added Siren Head to My Minecraft World",
        desc: "Not Junayed Scary - Siren Head Horror Mod",
        category: "gothic",
        thumb: "https://img.youtube.com/vi/bWxxOkOsOpY/hqdefault.jpg"
      },
      {
        id: "nWaV42u5jIQ",
        title: "Minecraft's Creepiest Mod Is Hunting Me - The Anomaly",
        desc: "Not Junayed Scary - The Anomaly Mod",
        category: "gothic",
        thumb: "https://img.youtube.com/vi/nWaV42u5jIQ/hqdefault.jpg"
      },
      {
        id: "fvIHaULAssc",
        title: "I Added The Man From The Fog In My Minecraft World...",
        desc: "Not Junayed Scary - The Man From The Fog",
        category: "supernatural",
        thumb: "https://img.youtube.com/vi/fvIHaULAssc/hqdefault.jpg"
      },
      {
        id: "a23AlP0gIfA",
        title: "😱 I Added The Scariest Horror Mod to Minecraft",
        desc: "Not Junayed Scary - Scariest Horror Mod Ever",
        category: "gothic",
        thumb: "https://img.youtube.com/vi/a23AlP0gIfA/hqdefault.jpg"
      },
      {
        id: "BQH_89TC4GU",
        title: "I Added Horror Mods [ The Boiled one ] in My Minecraft World",
        desc: "Not Junayed Scary - The Boiled One Mod",
        category: "psychological",
        thumb: "https://img.youtube.com/vi/BQH_89TC4GU/hqdefault.jpg"
      }
    ];

    let currentCategory = 'all';

    function displayVideos(items) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if (!items || items.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888; font-size: 16px; padding: 20px;">No videos found matching your search!</p>';
        return;
      }
      
      items.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${video.thumb}" alt="${video.title}">
            <div class="play-btn" onclick="openVideo('${video.id}')">
              <i class="fas fa-play"></i>
            </div>
          </div>
          <div class="video-info">
            <div class="video-title">${video.title}</div>
            <div class="video-desc">${video.desc}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openVideo(videoId) {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('youtubeIframe');
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      modal.style.display = 'flex';
    }

    function closeVideo() {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('youtubeIframe');
      iframe.src = '';
      modal.style.display = 'none';
    }

    function filterCategory(cat, evt) {
      currentCategory = cat;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      if(evt) evt.target.classList.add('active');

      applySearchAndFilter();
    }

    function applySearchAndFilter() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      
      const filtered = videos.filter(v => {
        const matchesCategory = (currentCategory === 'all') || (v.category === currentCategory);
        const matchesSearch = v.title.toLowerCase().includes(query) || v.desc.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      displayVideos(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applySearchAndFilter);
    displayVideos(videos);
  </script>
</body>
</html>
