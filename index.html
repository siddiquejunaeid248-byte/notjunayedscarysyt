<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Not Junayed Scary - Horror Content Portal</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030000;
      color: #ffffff;
      padding-bottom: 50px;
      overflow-x: hidden;
      position: relative;
      touch-action: manipulation;
    }

    /* Canvas Background for Flying Monsters */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -3;
      pointer-events: none;
    }

    /* Periodic Red Flash Layer */
    .red-flash-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, rgba(255, 0, 0, 0.4), rgba(100, 0, 0, 0.8) 80%);
      z-index: -2;
      opacity: 0;
      pointer-events: none;
      animation: flashGlow 7s infinite ease-in-out;
    }

    @keyframes flashGlow {
      0% { opacity: 0; }
      85% { opacity: 0; }
      88% { opacity: 0.8; }
      92% { opacity: 0.2; }
      95% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* Fog Overlay */
    .fog-layer {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(120, 0, 0, 0.15), rgba(5, 0, 0, 0.95) 70%);
      animation: fogRotate 20s infinite linear;
      z-index: -2;
      pointer-events: none;
    }

    .pulse-vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.4);
      animation: vignettePulse 2.5s infinite alternate ease-in-out;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes fogRotate {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes vignettePulse {
      0% { box-shadow: inset 0 0 80px rgba(150, 0, 0, 0.3); }
      100% { box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.7); }
    }

    /* Mobile Touch Ripple Effect */
    .touch-ripple {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid #ff0000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(0.5);
      animation: rippleExpand 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      box-shadow: 0 0 15px #ff0000;
    }

    @keyframes rippleExpand {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.3);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(3.5);
        border-color: #ff3333;
      }
    }

    /* Cursor Blood Drip Effect */
    .blood-drop {
      position: fixed;
      width: 8px;
      height: 8px;
      background-color: #ff0000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 0 6px #ff0000, 0 0 10px #8b0000;
      animation: dropDrip 0.8s linear forwards;
    }

    @keyframes dropDrip {
      0% { opacity: 1; transform: scale(1) translateY(0); }
      50% { opacity: 0.8; transform: scale(0.8) translateY(14px); }
      100% { opacity: 0; transform: scale(0.2) translateY(30px); }
    }

    /* Header Styling */
    header {
      background-color: rgba(15, 3, 3, 0.92);
      backdrop-filter: blur(8px);
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #8b0000;
      box-shadow: 0 4px 25px rgba(255, 0, 0, 0.25);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #ff0000;
      object-fit: cover;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
      animation: logoPulse 2.5s infinite alternate;
    }

    @keyframes logoPulse {
      0% { box-shadow: 0 0 8px rgba(255, 0, 0, 0.4); }
      100% { box-shadow: 0 0 20px rgba(255, 0, 0, 1); }
    }

    .brand-title {
      font-size: 22px;
      font-weight: bold;
      color: #ff3333;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }

    .brand-tagline {
      font-size: 11px;
      color: #aaaaaa;
      display: block;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .social-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .social-icon {
      color: #cccccc;
      font-size: 16px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #000000;
      border: 1px solid #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .social-icon:active {
      transform: scale(0.85);
    }

    .social-icon.youtube:hover { background-color: #ff0000; border-color: #ff0000; box-shadow: 0 0 10px rgba(255, 0, 0, 0.6); }
    .social-icon.facebook:hover { background-color: #1877f2; border-color: #1877f2; box-shadow: 0 0 10px rgba(24, 119, 242, 0.6); }
    .social-icon.discord:hover { background-color: #5865f2; border-color: #5865f2; box-shadow: 0 0 10px rgba(88, 101, 242, 0.6); }
    .social-icon.instagram:hover { background-color: #e4405f; border-color: #e4405f; box-shadow: 0 0 10px rgba(228, 64, 95, 0.6); }

    .subscribe-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #ff0000;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
      transition: all 0.2s ease;
    }

    .subscribe-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 25px rgba(255, 0, 0, 1);
    }

    .search-box {
      display: flex;
      align-items: center;
      background-color: #000000;
      border: 1px solid #441111;
      border-radius: 20px;
      overflow: hidden;
      padding: 5px 15px;
      width: 220px;
      transition: border-color 0.3s;
    }

    .search-box:focus-within {
      border-color: #ff0000;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.4);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      width: 100%;
      padding: 5px;
    }

    .search-box i {
      color: #888888;
    }

    /* Navigation Bar */
    nav {
      background-color: rgba(15, 3, 3, 0.9);
      padding: 12px 20px;
      display: flex;
      gap: 12px;
      border-bottom: 1px solid #221111;
      overflow-x: auto;
      scrollbar-width: none;
    }

    nav::-webkit-scrollbar {
      display: none;
    }

    .nav-btn {
      background-color: #1a0a0a;
      color: #cccccc;
      border: 1px solid #331111;
      padding: 8px 18px;
      border-radius: 20px;

      font-size: 14px;

    .nav-btn:active {

    /* Hero Section */
    .hero-banner {

      padding: 30px 25px;

    .hero-banner p {

      font-size: 14px;

    }

    /* Video Grid Section */
    .section-title {
      margin: 30px 40px 15px 40px;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.5);

    .video-grid {
      display: grid;

    .video-card {

      position: relative;

    }

    .video-card:active {

    .thumbnail-container {

      height: 170px;
      background-color: #1a0505;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 0, 0, 0.85);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
      transition: transform 0.2s ease;
    }

    .video-info {
      padding: 15px;
    }

    .video-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
      color: #ffffff;
    }

    .video-desc {
      font-size: 12px;
      color: #aaaaaa;
    }

    /* Modal Player Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      width: 92%;
      max-width: 850px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ff0000;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 15px;
      color: white;
      font-size: 28px;
      cursor: pointer;
      z-index: 1001;
    }

    .close-btn:active {
      color: #ff0000;
    }

    .iframe-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      header {
        padding: 12px 20px;
        flex-direction: column;
        align-items: flex-start;
      }

      .header-right {
        width: 100%;
        justify-content: space-between;
      }

      .search-box {
        width: 100%;
        margin-top: 5px;
      }

      .hero-banner, .video-grid, .section-title {
        margin-left: 15px;
        margin-right: 15px;
        padding-left: 0;
        padding-right: 0;
      }

      .video-grid {
        grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
        gap: 16px;
      }

      .hero-banner {
        padding: 20px;
      }
    }
  </style>
</head>

  <script>
    // Canvas Flying Horror Monsters / Bats Animation
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const monsters = [];
    const monsterCount = window.innerWidth < 768 ? 12 : 25;

    for (let i = 0; i < monsterCount; i++) {
      monsters.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 12 + 8,
        speedX: Math.random() * 2 + 1,
        speedY: (Math.random() - 0.5) * 1.5,
        wingAngle: 0,
        wingSpeed: Math.random() * 0.15 + 0.1
      });
    }

    function drawMonster(m) {
      ctx.save();
      ctx.translate(m.x, m.y);

      // Monster Body & Red Glowing Eyes
      ctx.fillStyle = '#110000';
      ctx.beginPath();
      ctx.arc(0, 0, m.size / 3, 0, Math.PI * 2);
      ctx.fill();

      // Red Glowing Eyes
      ctx.fillStyle = '#ff0000';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#ff0000';
      ctx.beginPath();
      ctx.arc(-m.size/8, -m.size/10, 1.5, 0, Math.PI * 2);
      ctx.arc(m.size/8, -m.size/10, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Animated Flying Wings
      ctx.fillStyle = 'rgba(150, 0, 0, 0.7)';
      const wingY = Math.sin(m.wingAngle) * (m.size / 2);

      // Left Wing
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-m.size, -m.size + wingY, -m.size * 1.3, wingY);
      ctx.quadraticCurveTo(-m.size / 2, wingY / 2, 0, 0);
      ctx.fill();

      // Right Wing
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(m.size, -m.size + wingY, m.size * 1.3, wingY);
      ctx.quadraticCurveTo(m.size / 2, wingY / 2, 0, 0);
      ctx.fill();

      ctx.restore();
    }

    function animateMonsters() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < monsters.length; i++) {
        let m = monsters[i];
        m.x += m.speedX;
        m.y += m.speedY;
        m.wingAngle += m.wingSpeed;

        if (m.x > canvas.width + 50) m.x = -50;
        if (m.y < -50) m.y = canvas.height + 50;
        if (m.y > canvas.height + 50) m.y = -50;

        drawMonster(m);
      }

      requestAnimationFrame(animateMonsters);
    }
    animateMonsters();

    // Mobile Touch Ripple Animation
    window.addEventListener('touchstart', function(e) {
      for (let i = 0; i < e.touches.length; i++) {
        createTouchRipple(e.touches[i].clientX, e.touches[i].clientY);
      }
    }, { passive: true });

    function createTouchRipple(x, y) {
      const ripple = document.createElement('div');
      ripple.className = 'touch-ripple';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';

      document.body.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
      }, 600);
    }

    // Blood Drip Cursor for Desktop/Mouse
    let lastDropTime = 0;
    document.addEventListener('mousemove', function(e) {
      const now = Date.now();
      if (now - lastDropTime > 45) {
        createBloodDrop(e.clientX, e.clientY);
        lastDropTime = now;
      }
    });

    function createBloodDrop(x, y) {
      const drop = document.createElement('div');
      drop.className = 'blood-drop';
      
      const offsetX = (Math.random() - 0.5) * 6;
      drop.style.left = (x + offsetX) + 'px';
      drop.style.top = y + 'px';
      
      const size = Math.random() * 5 + 5;
      drop.style.width = size + 'px';
      drop.style.height = size + 'px';

      document.body.appendChild(drop);

      setTimeout(() => {
        drop.remove();
      }, 800);
    }

    ];

    let currentCategory = 'all';

    function displayVideos(items) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if (!items || items.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888; font-size: 16px; padding: 20px;">No videos found matching your search!</p>';
        return;
      }
      
      items.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => openVideo(video.id);
        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${video.thumb}" alt="${video.title}">
            <div class="play-btn">
              <i class="fas fa-play"></i>
            </div>
          </div>
          <div class="video-info">
            <div class="video-title">${video.title}</div>
            <div class="video-desc">${video.desc}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openVideo(videoId) {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('youtubeIframe');
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      modal.style.display = 'flex';
    }

    function closeVideo() {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('youtubeIframe');
      iframe.src = '';
      modal.style.display = 'none';
    }

    function filterCategory(cat, evt) {
      currentCategory = cat;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      if(evt) evt.target.classList.add('active');

      applySearchAndFilter();
    }

    function applySearchAndFilter() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      
      const filtered = videos.filter(v => {
        const matchesCategory = (currentCategory === 'all') || (v.category === currentCategory);
        const matchesSearch = v.title.toLowerCase().includes(query) || v.desc.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      displayVideos(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applySearchAndFilter);
    displayVideos(videos);
  </script>
